    q('#f-img').onchange = () => pickImage(q('#f-img'), u => { pull(); f.img = u; draw(); });
    if (q('#f-noimg')) q('#f-noimg').onclick = () => { pull(); delete f.img; draw(); };
    q('#f-addsub').onclick = () => { pull(); f.subs.push({id: uid(), name: ''}); draw(); const l = sheet.querySelectorAll('[data-si]'); l[l.length-1].focus(); };
    if (q('#f-cancel')) q('#f-cancel').onclick = closeSheet;
    if (q('#f-del')) armDelete(q('#f-del'), () => { S.tasks = S.tasks.filter(x => x.id !== f.id); afterSave(); });
    q('#f-save').onclick = () => {
      pull(); f.name = f.name.trim(); f.subs = f.subs.filter(s => s.name.trim());
      if (!f.name){ q('#f-err').textContent = 'Dê um nome para a tarefa.'; q('#f-name').focus(); return; }
      if (f.freq === 'semanal' && !f.days.length){ q('#f-err').textContent = 'Escolha pelo menos um dia da semana.'; return; }
      if (f.freq === 'unica' && !f.date){ q('#f-err').textContent = 'Escolha a data.'; return; }
      const i = S.tasks.findIndex(x => x.id === f.id); if (i >= 0) S.tasks[i] = f; else S.tasks.push(f);
      afterSave();
    };
  };
  draw();
}

function grpForm(c, g){
  if (!c) return;
  const isNew = !g, f = {...(g || {id: 'g-' + uid(), name: ''})};
  const n = g ? S.tasks.filter(t => t.grp === g.id).length : 0;
  const draw = () => {
    openSheet(`<h3>${isNew ? 'Novo grupo' : 'Editar grupo'}</h3>
      <p class="note">Grupos dividem ${esc(c.name)} em partes, como locais de trabalho. Cada grupo tem as próprias atividades e o próprio tempo registrado.</p>
      <div class="field"><label for="g-name">Nome</label><input type="text" id="g-name" value="${esc(f.name)}" placeholder="Ex.: LCS"></div>
      <div class="field"><span class="lbl">Logo (opcional)</span><div class="imgpick"><span class="prev">${f.img ? `<img src="${f.img}" alt="">` : ''}</span>
        <label class="btnlike" for="g-img">Escolher imagem</label><input type="file" id="g-img" accept="image/*">${f.img ? '<button class="link" id="g-noimg">Remover</button>' : ''}</div></div>
      <div class="err" id="g-err"></div>
      <div class="actions">${isNew ? '<button class="btn" id="g-cancel">Cancelar</button>' : `<button class="btn danger" id="g-del">Excluir${n ? ` com ${plural(n, 'atividade', 'atividades')}` : ''}</button>`}<button class="btn primary" id="g-save">Salvar</button></div>`);
    const q = x => sheet.querySelector(x), pull = () => { f.name = q('#g-name').value; };
    q('#g-img').onchange = () => pickImage(q('#g-img'), u => { pull(); f.img = u; draw(); });
    if (q('#g-noimg')) q('#g-noimg').onclick = () => { pull(); delete f.img; draw(); };
    if (q('#g-cancel')) q('#g-cancel').onclick = closeSheet;
    const cc = () => S.cats.find(x => x.id === c.id);
    if (q('#g-del')) armDelete(q('#g-del'), () => { const k = cc(); if (k) k.groups = k.groups.filter(x => x.id !== f.id); S.tasks = S.tasks.filter(t => t.grp !== f.id); afterSave(); });
    q('#g-save').onclick = () => {
      pull(); f.name = f.name.trim();
      if (!f.name){ q('#g-err').textContent = 'Dê um nome para o grupo.'; q('#g-name').focus(); return; }
      const k = cc(); if (!k) { closeSheet(); return; }
      k.groups = k.groups || []; const i = k.groups.findIndex(x => x.id === f.id);
      if (i >= 0) k.groups[i] = f; else { k.groups.push(f); grpOpen.add(f.id); }
      afterSave();
    };
  };
  draw();
}

function catForm(c){
  const isNew = !c;
  const f = {...(c || {id: uid(), name:'', icon:'estrela', color: pc()[(S.cats.length) % pc().length]})};
  const n = c ? S.tasks.filter(t => t.cat === c.id).length : 0;
  const curArt = () => OLD_ART[f.art] || f.art || DEFAULT_ART[f.id] || 'estrela';
  openSheet(`<h3>${isNew ? 'Nova categoria' : 'Editar categoria'}</h3>
    <div class="field"><label for="c-name">Nome</label><input type="text" id="c-name" value="${esc(f.name)}" placeholder="Ex.: Casa"></div>
    <div class="field"><span class="lbl">Ícone</span><div class="icons arts">${Object.keys(ART).map(k => `<button data-art="${k}" class="${k === curArt() ? 'on' : ''}" aria-label="Ícone ${k}" style="color:${f.color}">${artSvg(k)}</button>`).join('')}</div></div>
    <div class="field"><span class="lbl">Ou uma imagem sua</span><div class="imgpick"><span class="prev" id="c-prev">${f.img ? `<img src="${f.img}" alt="">` : ''}</span>
      <label class="btnlike" for="c-img">Escolher imagem</label><input type="file" id="c-img" accept="image/*"><button class="link" id="c-noimg"${f.img ? '' : ' hidden'}>Remover</button></div></div>
    <label class="checkline"><input type="checkbox" id="c-tempo"${usesTime(f) ? ' checked' : ''}> Registrar tempo gasto nas tarefas desta categoria</label>
    <div class="field"><span class="lbl">Cor do bloco</span><div class="colors">${pc().map(x => `<button data-co="${x}" class="${x === f.color ? 'on' : ''}" style="background:${x}" aria-label="Cor ${x}"></button>`).join('')}</div></div>
    <div class="err" id="c-err"></div>
    <div class="actions">${isNew ? '<button class="btn" id="c-cancel">Cancelar</button>' : `<button class="btn danger" id="c-del">Excluir${n ? ` (e ${plural(n,'tarefa','tarefas')})` : ''}</button>`}<button class="btn primary" id="c-save">Salvar</button></div>`);
  const q = s => sheet.querySelector(s);
  const clearSel = () => sheet.querySelectorAll('[data-ic],[data-art]').forEach(x => x.classList.remove('on'));
  sheet.querySelectorAll('[data-ic]').forEach(b => b.onclick = () => { f.icon = b.dataset.ic; f.art = 'none'; clearSel(); b.classList.add('on'); });
  sheet.querySelectorAll('[data-art]').forEach(b => b.onclick = () => { f.art = b.dataset.art; clearSel(); b.classList.add('on'); });
  q('#c-img').onchange = () => pickImage(q('#c-img'), u => { f.img = u; q('#c-prev').innerHTML = `<img src="${u}" alt="">`; q('#c-noimg').hidden = false; });
  q('#c-noimg').onclick = () => { delete f.img; q('#c-prev').innerHTML = ''; q('#c-noimg').hidden = true; };
  sheet.querySelectorAll('[data-co]').forEach(b => b.onclick = () => { f.color = b.dataset.co; sheet.querySelectorAll('[data-co]').forEach(x => x.classList.toggle('on', x === b)); sheet.querySelectorAll('[data-art]').forEach(x => x.style.color = f.color); });
  if (q('#c-cancel')) q('#c-cancel').onclick = closeSheet;
  if (q('#c-del')) armDelete(q('#c-del'), () => { S.cats = S.cats.filter(x => x.id !== f.id); S.tasks = S.tasks.filter(t => t.cat !== f.id); if (openCat === f.id) openCat = null; afterSave(); });
  q('#c-save').onclick = () => {
    f.name = q('#c-name').value.trim(); f.tempo = q('#c-tempo').checked;
    if (!f.name){ q('#c-err').textContent = 'Dê um nome para a categoria.'; q('#c-name').focus(); return; }
    const i = S.cats.findIndex(x => x.id === f.id); if (i >= 0) S.cats[i] = f; else S.cats.push(f);
    afterSave();
  };
}

function metaFields(){
  return `<div class="field"><span class="lbl">Tipo de meta</span><div class="seg"><button data-mauto="0" class="${S.metaAuto ? '' : 'on'}">Fixa</button><button data-mauto="1" class="${S.metaAuto ? 'on' : ''}">Automática</button></div></div>
    <div class="field" id="m-fix"${S.metaAuto ? ' hidden' : ''}><label for="s-meta">Meta diária: <span id="s-val" class="num">${S.meta}%</span></label><input type="range" id="s-meta" min="10" max="100" step="5" value="${S.meta}"></div>
    <p class="note" id="m-auto"${S.metaAuto ? '' : ' hidden'}>A meta acompanha a sua média dos últimos 14 dias (entre 30% e 90%). Hoje ela está em <b class="num">${autoMeta()}%</b>.</p>
    <div class="field"><span class="lbl">Um dia conta na sequência quando</span><div class="seg"><button data-seq="meta" class="${seqMode() === 'meta' ? 'on' : ''}">Bato a meta</button><button data-seq="uma" class="${seqMode() === 'uma' ? 'on' : ''}">Marco 1 tarefa ou mais</button></div></div>`;
}
function wireMeta(f){
  const q = x => sheet.querySelector(x), r = q('#s-meta');
  f.meta = S.meta; f.metaAuto = !!S.metaAuto; f.seq = seqMode();
  r.oninput = () => { q('#s-val').textContent = r.value + '%'; f.meta = +r.value; };
  sheet.querySelectorAll('[data-mauto]').forEach(b => b.onclick = () => { f.metaAuto = b.dataset.mauto === '1'; sheet.querySelectorAll('[data-mauto]').forEach(x => x.classList.toggle('on', x === b)); q('#m-fix').hidden = f.metaAuto; q('#m-auto').hidden = !f.metaAuto; });
  sheet.querySelectorAll('[data-seq]').forEach(b => b.onclick = () => { f.seq = b.dataset.seq; sheet.querySelectorAll('[data-seq]').forEach(x => x.classList.toggle('on', x === b)); });
}
const applyMeta = f => { S.meta = f.meta; S.metaAuto = f.metaAuto; S.seq = f.seq; };
function metaForm(){
  const f = {};
  openSheet(`<h3>Meta do dia</h3>${metaFields()}<div class="actions"><button class="btn" id="m-cancel">Cancelar</button><button class="btn primary" id="m-ok">Salvar</button></div>`);
  wireMeta(f);
  sheet.querySelector('#m-cancel').onclick = closeSheet;
  sheet.querySelector('#m-ok').onclick = () => { applyMeta(f); afterSave(); };
}
// Foto de perfil: recorta no centro em quadrado e reduz para caber na sincronização
function pickPhoto(input, cb){
  const file = input.files && input.files[0]; if (!file) return;
  const rd = new FileReader();
  rd.onload = () => { const im = new Image(); im.onload = () => {
    const sz = 256, cv = document.createElement('canvas'); cv.width = cv.height = sz;
    const m = Math.min(im.width, im.height);
    cv.getContext('2d').drawImage(im, (im.width - m) / 2, (im.height - m) / 2, m, m, 0, 0, sz, sz);
    cb(cv.toDataURL('image/jpeg', .85));
  }; im.src = rd.result; };
  rd.readAsDataURL(file);
}
const avatarHtml = () => S.foto ? `<img src="${S.foto}" alt="">` : (userName() ? esc(userName()[0].toUpperCase()) : svg(UI.sol));
function profileFields(){
  return `<div class="field"><span class="lbl">Foto de perfil</span><div class="pfrow"><span class="pfprev" id="p-prev">${avatarHtml()}</span>
      <label class="pill-btn">${svg(UI.mais, 2.4)}<span>${S.foto ? 'Trocar foto' : 'Escolher foto'}</span><input type="file" accept="image/*" id="p-img" hidden></label>
      <button class="pill-btn" id="p-rm"${S.foto ? '' : ' hidden'}>Remover</button></div></div>
    <div class="field"><label for="s-nome">Seu nome</label><input type="text" id="s-nome" value="${esc(S.nome || userName())}" placeholder="Como quer ser chamado no Início" autocomplete="given-name"></div>
    <div class="field"><label for="s-app">Nome do app</label><input type="text" id="s-app" value="${esc(S.appNome || '')}" placeholder="Minha Rotina"></div>`;
}
function wireProfile(f){
  const q = x => sheet.querySelector(x);
  f.foto = S.foto || '';
  q('#p-img').onchange = () => pickPhoto(q('#p-img'), u => { f.foto = u; q('#p-prev').innerHTML = `<img src="${u}" alt="">`; q('#p-rm').hidden = false; });
  q('#p-rm').onclick = () => { f.foto = ''; q('#p-prev').innerHTML = esc((q('#s-nome').value.trim() || '?')[0].toUpperCase()); q('#p-rm').hidden = true; };
}
const applyProfile = f => { S.foto = f.foto; S.nome = sheet.querySelector('#s-nome').value.trim(); S.appNome = sheet.querySelector('#s-app').value.trim(); };
function profileForm(){
  const f = {};
  openSheet(`<h3>Seu perfil</h3>${profileFields()}<div class="actions"><button class="btn" id="p-cancel">Cancelar</button><button class="btn primary" id="p-ok">Salvar</button></div>`);
  wireProfile(f);
  sheet.querySelector('#p-cancel').onclick = closeSheet;
  sheet.querySelector('#p-ok').onclick = () => { applyProfile(f); afterSave(); };
}

/* ---------- Anotações ---------- */
let noteFilter = 'todas', noteQ = '';
const fmtWhen = ts => { const d = new Date(ts), k = keyOf(d); return k === TODAY ? `hoje, ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}` : k === addDays(TODAY, -1) ? 'ontem' : `${d.getDate()} ${MES[d.getMonth()]}`; };
const notesSorted = () => (S.notes || []).slice().sort((a, b) => (b.pin ? 1 : 0) - (a.pin ? 1 : 0) || b.upd - a.upd);
function noteCard(n){
  const c = n.cat ? S.cats.find(x => x.id === n.cat) : null;
  return `<button class="nt${n.pin ? ' pin' : ''}" data-note="${n.id}" style="${c ? `--c:${c.color}` : ''}">
    ${n.title ? `<b>${esc(n.title)}</b>` : ''}${n.body ? `<p>${esc(n.body)}</p>` : ''}
    <span class="nf mono">${c ? `<i></i>${esc(c.name)} · ` : ''}${fmtWhen(n.upd)}${n.pin ? `<span class="pinic">${svg(UI.estrela, 2)}</span>` : ''}</span></button>`;
}
function renderNotas(){
  const all = notesSorted(), qq = noteQ.trim().toLowerCase();
  const list = all.filter(n => (noteFilter !== 'fixadas' || n.pin) && (noteFilter === 'todas' || noteFilter === 'fixadas' || n.cat === noteFilter) && (!qq || (n.title + ' ' + n.body).toLowerCase().includes(qq)));
  const used = [...new Set(all.map(n => n.cat).filter(Boolean))].map(id => S.cats.find(c => c.id === id)).filter(Boolean);
  document.getElementById('scr-notas').innerHTML = `${pageHead('Anotações', 'Anotações', 'Ideias e lembretes')}
    <div class="tbar"><div class="filters" style="margin:0;flex-wrap:wrap">
      <button class="fchip${noteFilter === 'todas' ? ' on' : ''}" data-nf="todas">Todas · ${all.length}</button>
      <button class="fchip${noteFilter === 'fixadas' ? ' on' : ''}" data-nf="fixadas">Fixadas · ${all.filter(n => n.pin).length}</button>
      ${used.map(c => `<button class="fchip${noteFilter === c.id ? ' on' : ''}" data-nf="${c.id}">${esc(c.name)}</button>`).join('')}</div>
      <span class="sp"></span><input type="search" class="nsearch" id="nsearch" placeholder="Buscar nas anotações" value="${esc(noteQ)}"></div>
    <div class="notes"><button class="nt newnote" data-newnote="1">${svg(UI.mais, 2.2)}<span>Nova anotação</span></button>${list.map(noteCard).join('')}</div>
    ${!all.length ? `<p class="empty2">Escreva aqui ideias, listas e lembretes. Elas sincronizam com seus outros aparelhos.</p>` : !list.length ? `<p class="empty2">Nenhuma anotação encontrada.</p>` : ''}`;
  const inp = document.getElementById('nsearch');
  inp.oninput = () => { noteQ = inp.value; const pos = inp.selectionStart; renderNotas(); const n2 = document.getElementById('nsearch'); n2.focus(); n2.setSelectionRange(pos, pos); };
}
function noteForm(n, preset = {}){
  const isNew = !n; n = n || {id: uid(), title: '', body: '', pin: false, cat: preset.cat || '', upd: Date.now()};
  openSheet(`<h3>${isNew ? 'Nova anotação' : 'Anotação'}</h3>
    <div class="field"><label for="n-t">Título</label><input type="text" id="n-t" value="${esc(n.title)}" placeholder="Opcional"></div>
    <div class="field"><label for="n-b">Texto</label><textarea id="n-b" rows="8" placeholder="Escreva aqui">${esc(n.body)}</textarea></div>
    <div class="row2"><div class="field"><label for="n-c">Categoria</label><select id="n-c"><option value="">Nenhuma</option>${S.cats.map(c => `<option value="${c.id}"${n.cat === c.id ? ' selected' : ''}>${esc(c.name)}</option>`).join('')}</select></div>
      <div class="field"><span class="lbl">Fixar no topo</span><div class="seg"><button data-pin="0" class="${n.pin ? '' : 'on'}">Não</button><button data-pin="1" class="${n.pin ? 'on' : ''}">Sim</button></div></div></div>
    <div class="actions">${isNew ? '<button class="btn" id="n-cancel">Cancelar</button>' : '<button class="btn danger" id="n-del">Excluir</button>'}<button class="btn primary" id="n-ok">Salvar</button></div>`);
  const q = x => sheet.querySelector(x); let pin = !!n.pin;
  sheet.querySelectorAll('[data-pin]').forEach(b => b.onclick = () => { pin = b.dataset.pin === '1'; sheet.querySelectorAll('[data-pin]').forEach(x => x.classList.toggle('on', x === b)); });
  if (isNew) q('#n-cancel').onclick = closeSheet; else armDelete(q('#n-del'), () => { S.notes = S.notes.filter(x => x.id !== n.id); afterSave(); });
  q('#n-ok').onclick = () => {
    const t = q('#n-t').value.trim(), b = q('#n-b').value.replace(/\s+$/, '');
    if (!t && !b){ if (isNew) closeSheet(); else { S.notes = S.notes.filter(x => x.id !== n.id); afterSave(); } return; }
    Object.assign(n, {title: t, body: b, cat: q('#n-c').value, pin, upd: Date.now()});
    S.notes = S.notes || []; if (isNew) S.notes.push(n); afterSave();
  };
}

function settings(){
  const f = {};
  openSheet(`<h3>Ajustes</h3>
    ${profileFields()}
    ${metaFields()}
    <div class="field"><span class="lbl">Paleta de cores</span><div class="pals">${Object.entries(PALS).map(([k, v]) => `<button data-pal="${k}" class="${S.pal === k ? 'on' : ''}"><span class="sw">${v.prev.concat(v.cats.slice(0,4)).map(c => `<i style="background:${c}"></i>`).join('')}</span><b>${v.nome}</b></button>`).join('')}</div></div>
    <div class="field"><span class="lbl">Conta</span>${!cloudOn ? '<p class="note" style="margin:0">Modo local: os dados ficam só neste aparelho.</p>'
      : user ? `<div class="acct"><div><b>${esc(user.email)}</b><small id="s-sync">${SYNC_LABEL[syncState] + (syncErr ? ' · ' + syncErr : '')}</small></div><button class="fchip" id="s-syncnow">Sincronizar agora</button><button class="fchip" id="s-out">Sair</button></div>` : ''}</div>
    <div class="actions"><button class="btn danger" id="s-reset">Restaurar rotina inicial</button><button class="btn primary" id="s-ok">Pronto</button></div>`);
  if (sheet.querySelector('#s-syncnow')) sheet.querySelector('#s-syncnow').onclick = () => push().then(pull);
  if (sheet.querySelector('#s-out')) sheet.querySelector('#s-out').onclick = async () => { await push(); await sb.auth.signOut(); localStorage.removeItem('rotina-linked'); closeSheet(); };
  wireProfile(f); wireMeta(f);
  sheet.querySelector('#s-ok').onclick = () => { applyProfile(f); applyMeta(f); afterSave(); };
  sheet.querySelectorAll('[data-pal]').forEach(b => b.onclick = () => { setPal(b.dataset.pal); save(); render(); sheet.querySelectorAll('[data-pal]').forEach(x => x.classList.toggle('on', x === b)); });
  armDelete(sheet.querySelector('#s-reset'), () => { const pal = S.pal, keep = {nome: S.nome, foto: S.foto, appNome: S.appNome, notes: S.notes}; S = seed(); Object.assign(S, keep); S.pal = pal; S.cats.forEach(c => c.color = seedColor(c.id)); afterSave(); });
}

render();
initAuth();
</script>
